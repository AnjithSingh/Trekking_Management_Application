<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NomadTrails - Adventures Await</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>

<body style="background: #FFEED6;">

  <!-- Navbar -->
  <nav style="background: #fff; padding: 1rem 0; border-bottom: 1px solid #ebcca5;">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="{{ url_for('auth.index') }}" style="font-weight: 700; font-size: 1.3rem; color: #4a3e23; text-decoration: none;">
        Nomad<span style="color: #E8A07C;">Trails</span>
      </a>
      <div>
        <a href="{{ url_for('auth.login') }}" class="btn btn-outline-custom btn-sm me-2">Login</a>
        <a href="{{ url_for('auth.register') }}" class="btn btn-primary-custom btn-sm">Register</a>
      </div>
    </div>
  </nav>

  <!-- Hero Header -->
  <section class="text-center py-5">
    <div class="container">
      <h1 class="display-5 fw-bold" style="color: #4a3e23;">Discover Your Next <span style="color: #E8A07C;">Adventure</span></h1>
      <p class="lead mt-3" style="color: #827148;">Experience the beauty of nature. Join thousands of trekkers exploring the world's most breathtaking trails.</p>
      <div class="mt-4">
        <a href="{{ url_for('auth.register') }}" class="btn btn-primary-custom btn-lg px-4 me-3">Start Trekking</a>
      </div>
    </div>
  </section>

  <!-- Adventures Gallery -->
  <section class="py-5 bg-white">
    <div class="container">
      <h2 class="text-center fw-bold mb-4" style="color: #4a3e23;">Our Recent Adventures</h2>
      <div class="row g-4">
        
        <div class="col-md-6 col-lg-3">
          <div class="card border-0 shadow-sm h-100" style="background: #ebcca5;">
            <img src="/images/Trek-image.png" class="card-img-top" alt="Trek" style="height: 200px; object-fit: cover;">
            <div class="card-body text-center">
              <h6 class="fw-bold" style="color: #4a3e23;">Sonamarg</h6>
            </div>
          </div>
        </div>

        <div class="col-md-6 col-lg-3">
          <div class="card border-0 shadow-sm h-100" style="background: #ebcca5;">
            <img src="/images/image.png" class="card-img-top" alt="Trek" style="height: 200px; object-fit: cover;">
            <div class="card-body text-center">
              <h6 class="fw-bold" style="color: #4a3e23;">Dzukou Valley</h6>
            </div>
          </div>
        </div>

        <div class="col-md-6 col-lg-3">
          <div class="card border-0 shadow-sm h-100" style="background: #ebcca5;">
            <img src="/images/pexels-juliano-ferreira-102048601-9467306.jpg" class="card-img-top" alt="Trek" style="height: 200px; object-fit: cover;">
            <div class="card-body text-center">
              <h6 class="fw-bold" style="color: #4a3e23;">Kudermukh</h6>
            </div>
          </div>
        </div>

        <div class="col-md-6 col-lg-3">
          <div class="card border-0 shadow-sm h-100" style="background: #ebcca5;">
            <img src="/images/pexels-susan-flores-232226967-35662600.jpg" class="card-img-top" alt="Trek" style="height: 200px; object-fit: cover;">
            <div class="card-body text-center">
              <h6 class="fw-bold" style="color: #4a3e23;">Himalayas</h6>
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer style="background: #4a3e23; color: rgba(255,255,255,0.7); padding: 2rem 0; text-align: center;">
    <p class="mb-0">&copy; 2026 NomadTrails - Designed for Explorers</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
